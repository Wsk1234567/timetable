<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>2026/27 课程时间表</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --paper: #fff;
        --ink: #172033;
        --muted: #697386;
        --line: #dce2ec;
        --navy: #26365c;
        --blue: #526de2;
        --orange: #ed7b57;
        --hour: 42px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Noto Sans SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      button {
        font: inherit;
      }
      .app {
        max-width: 1600px;
        margin: auto;
        padding: 14px 20px 18px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 9px;
      }
      .eyebrow {
        font-size: 0.76rem;
        color: var(--blue);
        font-weight: 750;
        margin-bottom: 3px;
      }
      .top h1 {
        margin: 0;
        font-size: clamp(1.55rem, 2.4vw, 2.25rem);
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .top p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .term {
        background: var(--navy);
        color: #fff;
        border-radius: 11px;
        padding: 7px 11px;
        white-space: nowrap;
      }
      .term small {
        display: block;
        color: #c9d2ec;
        font-size: 0.78rem;
        margin-bottom: 2px;
      }
      .term strong {
        font-size: 0.88rem;
      }
      .quick-info {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }
      .next-inline {
        display: grid;
        grid-template-columns: auto auto;
        align-items: baseline;
        column-gap: 9px;
        min-width: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 6px 10px;
      }
      .next-inline small {
        color: var(--muted);
        font-size: 0.76rem;
      }
      .next-inline strong {
        font-size: 0.94rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 270px;
      }
      .next-time {
        color: var(--blue);
        font-size: 0.88rem !important;
        font-weight: 750;
        white-space: nowrap;
      }
      .meta {
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 700;
        white-space: nowrap;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 7px;
      }
      .legend {
        display: flex;
        gap: 7px;
        overflow: auto;
        padding: 3px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 10px;
        white-space: nowrap;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 650;
      }
      .chip.active {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .schedule-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .week-label {
        min-width: 132px;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .tool-btn {
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 5px 9px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 700;
      }
      .tool-btn.add {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .tool-btn:focus-visible,
      .activity-card:focus-visible {
        outline: 3px solid rgba(82, 109, 226, 0.28);
        outline-offset: 2px;
      }
      .schedule-wrap {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(48, 62, 94, 0.06);
      }
      .scroll {
        overflow: auto;
        height: calc(100vh - 142px);
        min-height: 520px;
      }
      .schedule {
        display: grid;
        grid-template-columns: 82px repeat(7, minmax(155px, 1fr));
        min-width: 1167px;
      }
      .corner,
      .day-head {
        height: 56px;
        position: sticky;
        top: 0;
        z-index: 8;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .corner {
        left: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .day-head {
        border-left: 1px solid var(--line);
        padding: 8px 11px;
      }
      .day-head span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 1px;
      }
      .day-head strong {
        font-size: 1.05rem;
      }
      .day-head.today {
        background: #f0f3ff;
      }
      .day-head.today strong {
        color: var(--blue);
      }
      .day-head.today span::after {
        content: "今天";
        margin-left: 7px;
        background: var(--blue);
        color: #fff;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 0.68rem;
      }
      .time-col {
        height: calc(10 * var(--hour));
        position: sticky;
        left: 0;
        z-index: 5;
        border-right: 1px solid var(--line);
        background: #fafbfe;
      }
      .time {
        position: absolute;
        right: 12px;
        transform: translateY(-50%);
        font-size: 0.82rem;
        color: #7b8596;
        font-weight: 650;
      }
      .time:first-child {
        top: 7px !important;
        transform: none;
      }
      .time:last-child {
        top: auto !important;
        bottom: 7px;
        transform: none;
      }
      .day-col {
        height: calc(10 * var(--hour));
        position: relative;
        border-right: 1px solid var(--line);
        background-image: linear-gradient(
          to bottom,
          transparent calc(var(--hour) - 1px),
          #e5eaf2 calc(var(--hour) - 1px)
        );
        background-size: 100% var(--hour);
      }
      .day-col:last-child {
        border-right: 0;
      }
      .day-col::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(
          to bottom,
          transparent calc(var(--hour) / 2 - 1px),
          rgba(229, 234, 242, 0.6) calc(var(--hour) / 2 - 1px),
          rgba(229, 234, 242, 0.6) calc(var(--hour) / 2),
          transparent calc(var(--hour) / 2)
        );
        background-size: 100% var(--hour);
      }
      .class-card {
        position: absolute;
        left: 7px;
        right: 7px;
        z-index: 3;
        border: 1px solid transparent;
        border-left: 5px solid;
        border-radius: 10px;
        padding: 6px 8px;
        text-align: left;
        color: var(--ink);
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          filter 0.12s ease;
      }
      .class-card:hover {
        transform: translateY(-1px);
        filter: saturate(1.12);
      }
      .class-card:focus-visible,
      .chip:focus-visible,
      .close:focus-visible {
        outline: 3px solid rgba(82, 109, 226, 0.28);
        outline-offset: 2px;
      }
      .class-card .code {
        display: block;
        font-size: 0.78rem;
        font-weight: 800;
        line-height: 1.2;
      }
      .class-card .kind {
        display: block;
        font-size: 0.7rem;
        font-weight: 700;
        margin-top: 2px;
        opacity: 0.74;
      }
      .class-card .room {
        display: block;
        font-size: 0.72rem;
        margin-top: 6px;
        line-height: 1.25;
        opacity: 0.72;
      }
      .class-card[data-course="CS6214"] {
        background: #dff1eb;
        border-color: #2c9470;
      }
      .class-card[data-course="CS6224"] {
        background: #e7ecff;
        border-color: #526de2;
      }
      .class-card[data-course="CS6314"] {
        background: #f2e9fb;
        border-color: #8d64bd;
      }
      .class-card[data-course="MA6134"] {
        background: #fff0d8;
        border-color: #d38c28;
      }
      .class-card[data-course="PU3192"] {
        background: #ffe8e2;
        border-color: #dd7256;
      }
      .class-card[data-course="SW6112"] {
        background: #e3f1f7;
        border-color: #3d8cae;
      }
      .class-card.dim {
        opacity: 0.18;
        filter: grayscale(0.7);
      }
      .fit-tight .class-card {
        padding: 3px 6px;
      }
      .fit-tight .class-card .code {
        font-size: 0.7rem;
        line-height: 1.08;
      }
      .fit-tight .class-card .kind {
        display: none;
      }
      .fit-tight .class-card .room {
        display: block;
        margin-top: 2px;
        font-size: 0.6rem;
        line-height: 1.05;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .activity-card {
        position: absolute;
        z-index: 5;
        border: 1px solid #e07061;
        border-left: 5px solid #e35f4d;
        border-radius: 9px;
        padding: 5px 7px;
        background: #ffe5df;
        color: var(--ink);
        text-align: left;
        overflow: hidden;
        cursor: pointer;
      }
      .activity-card strong,
      .activity-card span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .activity-card strong {
        font-size: 0.75rem;
        line-height: 1.15;
      }
      .activity-card span {
        margin-top: 2px;
        font-size: 0.62rem;
        color: #87524a;
      }
      .fit-tight .activity-card {
        padding: 3px 5px;
      }
      .fit-tight .activity-card span {
        display: none;
      }
      .now {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--orange);
        z-index: 6;
      }
      .now::before {
        content: "";
        position: absolute;
        left: -4px;
        top: -4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--orange);
      }
      .empty {
        position: absolute;
        top: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: #a7afbd;
        font-size: 0.8rem;
      }
      dialog {
        border: 0;
        border-radius: 22px;
        padding: 0;
        width: min(560px, calc(100% - 28px));
        box-shadow: 0 30px 90px rgba(22, 32, 51, 0.27);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(19, 29, 48, 0.44);
        backdrop-filter: blur(3px);
      }
      .modal {
        padding: 25px;
      }
      .modal-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }
      .modal-code {
        color: var(--blue);
        font-weight: 800;
        font-size: 0.9rem;
      }
      .modal h2 {
        font-size: 1.45rem;
        line-height: 1.3;
        margin: 4px 0 0;
      }
      .close {
        border: 0;
        background: #eff2f7;
        border-radius: 50%;
        width: 39px;
        height: 39px;
        cursor: pointer;
        font-size: 1.25rem;
      }
      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 22px;
      }
      .detail {
        background: #f5f7fb;
        border-radius: 12px;
        padding: 12px 14px;
      }
      .detail.full {
        grid-column: 1/-1;
      }
      .detail small {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        margin-bottom: 5px;
      }
      .detail strong {
        font-size: 0.94rem;
        line-height: 1.4;
      }
      .note {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.55;
      }
      .activity-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }
      .field input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        background: #fff;
        color: var(--ink);
      }
      .field input:focus {
        outline: 3px solid rgba(82, 109, 226, 0.18);
        border-color: var(--blue);
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }
      .form-actions .delete {
        margin-right: auto;
        display: none;
        color: #b84335;
        border-color: #efc1ba;
      }
      .editing .form-actions .delete {
        display: inline-flex;
      }
      @media (max-width: 800px) {
        .app {
          padding: 10px 10px 18px;
        }
        .top {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .term {
          display: none;
        }
        .quick-info {
          width: 100%;
          justify-content: space-between;
          gap: 10px;
        }
        .controls {
          align-items: flex-start;
          flex-direction: column;
        }
        .schedule-tools {
          width: 100%;
          overflow-x: auto;
          padding-bottom: 2px;
        }
        .legend {
          width: 100%;
        }
        .hint {
          white-space: normal;
        }
        .scroll {
          height: calc(100vh - 190px);
          min-height: 520px;
        }
        .schedule {
          grid-template-columns: 75px repeat(7, 165px);
        }
        .corner {
          width: 75px;
        }
        .day-head {
          padding: 12px 10px;
        }
        .class-card {
          padding: 8px;
        }
      }
      @media (max-width: 500px) {
        .top h1 {
          font-size: 1.65rem;
        }
        .next-inline strong {
          max-width: 180px;
        }
        .next-time {
          display: none;
        }
        .meta {
          display: none;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .activity-form {
          grid-template-columns: 1fr;
        }
        .field.full {
          grid-column: auto;
        }
        .detail.full {
          grid-column: auto;
        }
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <div class="eyebrow">MMU · B.C.S (Hons)</div>
          <h1>我的课程时间表</h1>
          <p>Trimester Oct/Nov 2026 · 点击课程查看详情</p>
        </div>
        <div class="quick-info">
          <div class="next-inline">
            <small>下一堂课</small><strong id="nextName">—</strong> <span></span
            ><span class="next-time" id="nextTime">—</span>
          </div>
          <div class="meta">10 堂 · 20 小时</div>
          <div class="term">
            <small>学期日期</small><strong>9 Nov 2026 — 14 Feb 2027</strong>
          </div>
        </div>
      </header>
      <div class="controls">
        <div class="legend" id="legend"></div>
        <div class="schedule-tools">
          <button class="tool-btn" id="prevWeek" aria-label="上一周">‹</button>
          <strong class="week-label" id="weekLabel"></strong>
          <button class="tool-btn" id="nextWeek" aria-label="下一周">›</button>
          <button class="tool-btn" id="todayWeek">本周</button>
          <button class="tool-btn add" id="addActivity">＋ 添加活动</button>
        </div>
      </div>
      <section class="schedule-wrap" aria-label="每周课程时间表">
        <div class="scroll" id="scroll">
          <div class="schedule" id="schedule"></div>
        </div>
      </section>
    </main>
    <dialog id="detailDialog">
      <div class="modal">
        <div class="modal-top">
          <div>
            <div class="modal-code" id="modalCode"></div>
            <h2 id="modalTitle"></h2>
          </div>
          <button class="close" id="closeDialog" aria-label="关闭">×</button>
        </div>
        <div class="details">
          <div class="detail">
            <small>上课时间</small><strong id="modalTime"></strong>
          </div>
          <div class="detail">
            <small>类型</small><strong id="modalKind"></strong>
          </div>
          <div class="detail">
            <small>Class section</small><strong id="modalSection"></strong>
          </div>
          <div class="detail full">
            <small>教室</small><strong id="modalRoom"></strong>
          </div>
          <div class="detail full">
            <small>上课日期</small><strong id="modalDates"></strong>
          </div>
          <div class="detail">
            <small>学分</small><strong id="modalUnits"></strong>
          </div>
          <div class="detail">
            <small>Class number</small><strong id="modalClass"></strong>
          </div>
        </div>
        <p class="note">
          日期与教室来自你提供的课程系统截图；如校方临时调整，请以 eBwise
          最新通知为准。
        </p>
      </div>
    </dialog>
    <dialog id="activityDialog">
      <form class="modal" id="activityForm">
        <div class="modal-top">
          <div>
            <div class="modal-code">个人安排</div>
            <h2 id="activityModalTitle">添加活动</h2>
          </div>
          <button
            class="close"
            type="button"
            id="closeActivity"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <div class="activity-form">
          <div class="field full">
            <label for="activityTitle">活动名称</label>
            <input
              id="activityTitle"
              name="title"
              required
              maxlength="50"
              placeholder="例如：小组讨论"
            />
          </div>
          <div class="field full">
            <label for="activityDate">日期</label>
            <input id="activityDate" name="date" type="date" required />
          </div>
          <div class="field">
            <label for="activityStart">开始时间</label>
            <input
              id="activityStart"
              name="start"
              type="time"
              min="05:00"
              max="23:59"
              step="300"
              required
            />
          </div>
          <div class="field">
            <label for="activityEnd">结束时间</label>
            <input
              id="activityEnd"
              name="end"
              type="time"
              min="05:00"
              max="23:59"
              step="300"
              required
            />
          </div>
          <div class="field full">
            <label for="activityLocation">地点（可不填）</label>
            <input
              id="activityLocation"
              name="location"
              maxlength="60"
              placeholder="例如：Library Discussion Room"
            />
          </div>
        </div>
        <div class="form-actions">
          <button class="tool-btn delete" type="button" id="deleteActivity">
            删除
          </button>
          <button class="tool-btn" type="button" id="cancelActivity">
            取消
          </button>
          <button class="tool-btn add" type="submit">保存活动</button>
        </div>
      </form>
    </dialog>
    <script>
      const DAYS = [

      ];

        {

          section: "TC1L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3703",
          dates: "9 Nov 2026 — 8 Feb 2027",
        },
        {
          course: "CS6224",
          day: 1,
          start: "12:00",
          end: "14:00",
          kind: "Tutorial",
          section: "TT1L",
          room: "CQAR3002-FCI Computing Lab",
          classNo: "4287",
          dates: "9 Nov 2026 — 13 Feb 2027",
        },
        {
          course: "CS6224",
          day: 1,
          start: "14:00",
          end: "16:00",
          kind: "Lecture",
          section: "TC1L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3704",
          dates: "10 Nov 2026 — 9 Feb 2027",
        },
        {
          course: "CS6314",
          day: 2,
          start: "08:00",
          end: "10:00",
          kind: "Tutorial",
          section: "TT8L",
          room: "CQAR2007-FCI CISCO IP C.I. C2",
          classNo: "3710",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "MA6134",
          day: 2,
          start: "10:00",
          end: "12:00",
          kind: "Lecture",
          section: "TC1L",
          room: "CQAR1009-FCI Tutorial room",
          classNo: "3774",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "CS6314",
          day: 2,
          start: "12:00",
          end: "14:00",
          kind: "Lecture",
          section: "TC3L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3718",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "SW6112",
          day: 2,
          start: "14:00",
          end: "16:00",
          kind: "Lecture",
          section: "FC1L",
          room: "To be Announced",
          classNo: "4137",
          dates: "9 Nov 2026 — 14 Feb 2027",
        },
        {
          course: "CS6214",
          day: 2,
          start: "16:00",
          end: "18:00",
          kind: "Tutorial",
          section: "TT1L",
          room: "CQAR3002-FCI Computing Lab",
          classNo: "4283",
          dates: "9 Nov 2026 — 13 Feb 2027",
        },
      ];
      let selected = "ALL";
      let weekOffset = 0;
      let editingActivity = null;
      let activities = JSON.parse(
        localStorage.getItem("my-timetable-activities") || "[]",
      );
      const $ = (s) => document.querySelector(s),
        toMin = (t) => {
          const [h, m] = t.split(":").map(Number);
          return h * 60 + m;
        };
      const pad = (n) => String(n).padStart(2, "0");
      function dateKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }
      function monday(offset = weekOffset) {
        const date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() - ((date.getDay() + 6) % 7) + offset * 7);
        return date;
      }
      function dayDate(index) {
        const date = monday();
        date.setDate(date.getDate() + index);
        return date;
      }
      function formatDay(date) {
        return new Intl.DateTimeFormat("en", {
          month: "short",
          day: "numeric",
        }).format(date);
      }
      function saveActivities() {
        localStorage.setItem(
          "my-timetable-activities",
          JSON.stringify(activities),
        );
      }
      function overlaps(a, b) {
        return toMin(a.start) < toMin(b.end) && toMin(a.end) > toMin(b.start);
      }
      function escapeHtml(value) {
        const node = document.createElement("div");
        node.textContent = value || "";
        return node.innerHTML;
      }
      function renderLegend() {
        const keys = ["ALL", ...Object.keys(courses)];
        $("#legend").innerHTML = keys
          .map(
            (k) =>
              `<button class="chip ${selected === k ? "active" : ""}" data-course="${k}">${k === "ALL" ? "全部课程" : courses[k].fullCode}</button>`,
          )
          .join("");
        document.querySelectorAll(".chip").forEach(
          (b) =>
            (b.onclick = () => {
              selected = b.dataset.course;
              renderLegend();
              render();
            }),
        );
      }
      function render() {
        const now = new Date();
        const weekStart = monday();
        const weekEnd = dayDate(6);
        $("#weekLabel").textContent =
          `${formatDay(weekStart)}–${formatDay(weekEnd)}, ${weekEnd.getFullYear()}`;
        const availableHeight =
          $("#scroll").clientHeight || window.innerHeight - 142;
        const hourHeight =
          window.innerWidth <= 800
            ? 54
            : Math.max(24, Math.min(44, (availableHeight - 56) / 19));
        document.documentElement.style.setProperty("--hour", `${hourHeight}px`);
        document.body.classList.toggle("fit-tight", hourHeight < 30);
        let html =
          '<div class="corner">TIME</div>' +
          DAYS.map((day, index) => {
            const date = dayDate(index);
            const isToday = dateKey(date) === dateKey(now);
            return `<div class="day-head ${isToday ? "today" : ""}"><span>${formatDay(date)}</span><strong>${day}</strong></div>`;
          }).join("");
        html +=
          '<div class="time-col" style="height:calc(19 * var(--hour))">' +
          Array.from(
            { length: 20 },
            (_, i) =>
              `<span class="time" style="top:${i * hourHeight}px">${String((i + 5) % 24).padStart(2, "0")}:00</span>`,
          ).join("") +
          "</div>";
        for (let day = 0; day < 7; day++) {
          const list = classes.filter((courseClass) => courseClass.day === day);
          const currentDate = dayDate(day);
          const dateActivities = activities.filter(
            (activity) => activity.date === dateKey(currentDate),
          );
          html += `<div class="day-col" style="height:calc(19 * var(--hour))">${list.length || dateActivities.length ? "" : '<span class="empty">No class</span>'}`;
          for (const courseClass of list) {
            const top = (toMin(courseClass.start) - 300) * (hourHeight / 60),
              height =
                (toMin(courseClass.end) - toMin(courseClass.start)) *
                  (hourHeight / 60) -
                3,
              dim = selected !== "ALL" && selected !== courseClass.course,
              sharesTime = dateActivities.some((activity) =>
                overlaps(courseClass, activity),
              );
            html += `<button class="class-card ${dim ? "dim" : ""}" aria-label="${courses[courseClass.course].name}, ${courseClass.kind}, ${courseClass.start}–${courseClass.end}" data-course="${courseClass.course}" data-index="${classes.indexOf(courseClass)}" style="top:${top}px;height:${height}px;right:${sharesTime ? "50%" : "7px"}"><span class="code">${courses[courseClass.course].name}</span><span class="kind">${courseClass.kind} · ${courseClass.start}–${courseClass.end}</span><span class="room">${courseClass.room}</span></button>`;
          }
          for (const activity of dateActivities) {
            const top = (toMin(activity.start) - 300) * (hourHeight / 60);
            const height = Math.max(
              18,
              (toMin(activity.end) - toMin(activity.start)) *
                (hourHeight / 60) -
                3,
            );
            const sharesTime = list.some((courseClass) =>
              overlaps(courseClass, activity),
            );
            const location = activity.location
              ? ` · ${escapeHtml(activity.location)}`
              : "";
            html += `<button class="activity-card" data-activity-id="${activity.id}" aria-label="${escapeHtml(activity.title)}, ${activity.start}–${activity.end}${location}" style="top:${top}px;height:${height}px;left:${sharesTime ? "52%" : "7px"};right:7px"><strong>${escapeHtml(activity.title)}</strong><span>${activity.start}–${activity.end}${location}</span></button>`;
          }
          if (dateKey(currentDate) === dateKey(now) && now.getHours() >= 5) {
            const top =
              (now.getHours() * 60 + now.getMinutes() - 300) *
              (hourHeight / 60);
            html += `<div class="now" style="top:${top}px"></div>`;
          }
          html += "</div>";
        }
        $("#schedule").innerHTML = html;
        document
          .querySelectorAll(".class-card")
          .forEach(
            (button) =>
              (button.onclick = () =>
                showDetail(classes[+button.dataset.index])),
          );
        document
          .querySelectorAll(".activity-card")
          .forEach(
            (button) =>
              (button.onclick = () =>
                openActivity(
                  activities.find(
                    (activity) => activity.id === button.dataset.activityId,
                  ),
                )),
          );
      }
      function showDetail(c) {
        const info = courses[c.course];
        $("#modalCode").textContent = info.fullCode;
        $("#modalTitle").textContent = info.name;
        $("#modalTime").textContent = `${DAYS[c.day]} · ${c.start}–${c.end}`;
        $("#modalKind").textContent = c.kind;
        $("#modalSection").textContent = c.section;
        $("#modalRoom").textContent = c.room;
        $("#modalDates").textContent = c.dates;
        $("#modalUnits").textContent = info.units;
        $("#modalClass").textContent = c.classNo;
        $("#detailDialog").showModal();
      }
      function weekOffsetForDate(value) {
        const target = new Date(`${value}T12:00:00`);
        const targetMonday = new Date(target);
        targetMonday.setDate(target.getDate() - ((target.getDay() + 6) % 7));
        return Math.round((targetMonday - monday(0)) / 604800000);
      }
      function openActivity(activity = null) {
        editingActivity = activity?.id || null;
        $("#activityForm").classList.toggle("editing", Boolean(activity));
        $("#activityModalTitle").textContent = activity
          ? "编辑活动"
          : "添加活动";
        $("#activityForm").reset();
        const today = new Date();
        const currentWeekContainsToday =
          dateKey(today) >= dateKey(monday()) &&
          dateKey(today) <= dateKey(dayDate(6));
        $("#activityTitle").value = activity?.title || "";
        $("#activityDate").value =
          activity?.date ||
          (currentWeekContainsToday ? dateKey(today) : dateKey(dayDate(0)));
        $("#activityStart").value = activity?.start || "09:00";
        $("#activityEnd").value = activity?.end || "10:00";
        $("#activityLocation").value = activity?.location || "";
        $("#activityDialog").showModal();
        setTimeout(() => $("#activityTitle").focus(), 30);
      }
      function closeActivity() {
        $("#activityDialog").close();
        editingActivity = null;
      }
      function nextClass() {
        const now = new Date(),
          d = (now.getDay() + 6) % 7,
          m = now.getHours() * 60 + now.getMinutes();
        const next = classes
          .filter((c) => c.day > d || (c.day === d && toMin(c.start) >= m))
          .sort((a, b) => a.day - b.day || toMin(a.start) - toMin(b.start))[0];
        $("#nextName").textContent = next
          ? `${courses[next.course].name} · ${next.kind}`
          : "本周课程已结束";
        $("#nextTime").textContent = next
          ? `${next.day === d ? "今天" : DAYS[next.day]} ${next.start}`
          : "休息一下";
      }
      $("#closeDialog").onclick = () => $("#detailDialog").close();
      $("#detailDialog").onclick = (e) => {
        if (e.target === $("#detailDialog")) $("#detailDialog").close();
      };
      $("#prevWeek").onclick = () => {
        weekOffset -= 1;
        render();
      };
      $("#nextWeek").onclick = () => {
        weekOffset += 1;
        render();
      };
      $("#todayWeek").onclick = () => {
        weekOffset = 0;
        render();
      };
      $("#addActivity").onclick = () => openActivity();
      $("#closeActivity").onclick = closeActivity;
      $("#cancelActivity").onclick = closeActivity;
      $("#activityDialog").onclick = (event) => {
        if (event.target === $("#activityDialog")) closeActivity();
      };
      $("#activityEnd").oninput = () => $("#activityEnd").setCustomValidity("");
      $("#activityForm").onsubmit = (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget));
        if (toMin(data.end) <= toMin(data.start)) {
          $("#activityEnd").setCustomValidity("结束时间必须晚于开始时间");
          $("#activityEnd").reportValidity();
          return;
        }
        $("#activityEnd").setCustomValidity("");
        const record = {
          id: editingActivity || String(Date.now()),
          title: data.title.trim(),
          date: data.date,
          start: data.start,
          end: data.end,
          location: data.location.trim(),
        };
        if (editingActivity) {
          const index = activities.findIndex(
            (activity) => activity.id === editingActivity,
          );
          activities[index] = record;
        } else {
          activities.push(record);
        }
        saveActivities();
        weekOffset = weekOffsetForDate(record.date);
        closeActivity();
        render();
      };
      $("#deleteActivity").onclick = () => {
        activities = activities.filter(
          (activity) => activity.id !== editingActivity,
        );
        saveActivities();
        closeActivity();
        render();
      };
      renderLegend();
      render();
      nextClass();
      let resizeFrame;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(render);
      });
      setInterval(() => {
        render();
        nextClass();
      }, 60000);
    </script>
  </body>
