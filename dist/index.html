<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>2026/27 课程时间表</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --paper: #fff;
        --ink: #172033;
        --muted: #697386;
        --line: #dce2ec;
        --navy: #26365c;
        --blue: #526de2;
        --orange: #ed7b57;
        --hour: 42px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Noto Sans SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      button {
        font: inherit;
      }
      .app {
        max-width: 1600px;
        margin: auto;
        padding: 14px 20px 18px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 9px;
      }
      .eyebrow {
        font-size: 0.76rem;
        color: var(--blue);
        font-weight: 750;
        margin-bottom: 3px;
      }
      .top h1 {
        margin: 0;
        font-size: clamp(1.55rem, 2.4vw, 2.25rem);
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .top p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .term {
        border-left: 1px solid var(--line);
        padding-left: 16px;
        white-space: nowrap;
      }
      .term small {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        margin-bottom: 2px;
      }
      .term strong {
        font-size: 0.88rem;
      }
      .quick-info {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        min-width: 0;
      }
      .next-inline {
        display: grid;
        grid-template-columns: auto auto;
        align-items: baseline;
        column-gap: 9px;
        min-width: 0;
      }
      .next-inline small {
        color: var(--muted);
        font-size: 0.76rem;
      }
      .next-inline strong {
        font-size: 0.94rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 270px;
      }
      .next-time {
        color: var(--blue);
        font-size: 0.88rem !important;
        font-weight: 750;
        white-space: nowrap;
      }
      .meta {
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 7px;
      }
      .legend {
        display: flex;
        gap: 7px;
        overflow: auto;
        padding: 3px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 10px;
        white-space: nowrap;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 650;
      }
      .chip.active {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .schedule-wrap {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(48, 62, 94, 0.06);
      }
      .scroll {
        overflow: auto;
        height: calc(100vh - 142px);
        min-height: 520px;
      }
      .schedule {
        display: grid;
        grid-template-columns: 82px repeat(7, minmax(155px, 1fr));
        min-width: 1167px;
      }
      .corner,
      .day-head {
        height: 56px;
        position: sticky;
        top: 0;
        z-index: 8;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .corner {
        left: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .day-head {
        border-left: 1px solid var(--line);
        padding: 8px 11px;
      }
      .day-head span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 1px;
      }
      .day-head strong {
        font-size: 1.05rem;
      }
      .day-head.today {
        background: #f0f3ff;
      }
      .day-head.today strong {
        color: var(--blue);
      }
      .day-head.today span::after {
        content: "今天";
        margin-left: 7px;
        background: var(--blue);
        color: #fff;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 0.68rem;
      }
      .time-col {
        height: calc(10 * var(--hour));
        position: sticky;
        left: 0;
        z-index: 5;
        border-right: 1px solid var(--line);
        background: #fafbfe;
      }
      .time {
        position: absolute;
        right: 12px;
        transform: translateY(-50%);
        font-size: 0.82rem;
        color: #7b8596;
        font-weight: 650;
      }
      .time:first-child {
        top: 7px !important;
        transform: none;
      }
      .time:last-child {
        top: auto !important;
        bottom: 7px;
        transform: none;
      }
      .day-col {
        height: calc(10 * var(--hour));
        position: relative;
        border-right: 1px solid var(--line);
        background-image: linear-gradient(
          to bottom,
          transparent calc(var(--hour) - 1px),
          #e5eaf2 calc(var(--hour) - 1px)
        );
        background-size: 100% var(--hour);
      }
      .day-col:last-child {
        border-right: 0;
      }
      .day-col::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(
          to bottom,
          transparent calc(var(--hour) / 2 - 1px),
          rgba(229, 234, 242, 0.6) calc(var(--hour) / 2 - 1px),
          rgba(229, 234, 242, 0.6) calc(var(--hour) / 2),
          transparent calc(var(--hour) / 2)
        );
        background-size: 100% var(--hour);
      }
      .class-card {
        position: absolute;
        left: 7px;
        right: 7px;
        z-index: 3;
        border: 1px solid transparent;
        border-left: 5px solid;
        border-radius: 10px;
        padding: 6px 8px;
        text-align: left;
        color: var(--ink);
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          filter 0.12s ease;
      }
      .class-card:hover {
        transform: translateY(-1px);
        filter: saturate(1.12);
      }
      .class-card:focus-visible,
      .chip:focus-visible,
      .close:focus-visible {
        outline: 3px solid rgba(82, 109, 226, 0.28);
        outline-offset: 2px;
      }
      .class-card .code {
        display: block;
        font-size: 0.78rem;
        font-weight: 800;
        line-height: 1.2;
      }
      .class-card .kind {
        display: block;
        font-size: 0.7rem;
        font-weight: 700;
        margin-top: 2px;
        opacity: 0.74;
      }
      .class-card .room {
        display: none;
        font-size: 0.72rem;
        margin-top: 6px;
        line-height: 1.25;
        opacity: 0.72;
      }
      .class-card[data-course="CS6214"] {
        background: #dff1eb;
        border-color: #2c9470;
      }
      .class-card[data-course="CS6224"] {
        background: #e7ecff;
        border-color: #526de2;
      }
      .class-card[data-course="CS6314"] {
        background: #f2e9fb;
        border-color: #8d64bd;
      }
      .class-card[data-course="MA6134"] {
        background: #fff0d8;
        border-color: #d38c28;
      }
      .class-card[data-course="PU3192"] {
        background: #ffe8e2;
        border-color: #dd7256;
      }
      .class-card[data-course="SW6112"] {
        background: #e3f1f7;
        border-color: #3d8cae;
      }
      .class-card.dim {
        opacity: 0.18;
        filter: grayscale(0.7);
      }
      .fit-tight .class-card {
        padding: 3px 6px;
      }
      .fit-tight .class-card .code {
        font-size: 0.7rem;
        line-height: 1.08;
      }
      .fit-tight .class-card .kind {
        display: none;
      }
      .now {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--orange);
        z-index: 6;
      }
      .now::before {
        content: "";
        position: absolute;
        left: -4px;
        top: -4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--orange);
      }
      .empty {
        position: absolute;
        top: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: #a7afbd;
        font-size: 0.8rem;
      }
      dialog {
        border: 0;
        border-radius: 22px;
        padding: 0;
        width: min(560px, calc(100% - 28px));
        box-shadow: 0 30px 90px rgba(22, 32, 51, 0.27);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(19, 29, 48, 0.44);
        backdrop-filter: blur(3px);
      }
      .modal {
        padding: 25px;
      }
      .modal-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }
      .modal-code {
        color: var(--blue);
        font-weight: 800;
        font-size: 0.9rem;
      }
      .modal h2 {
        font-size: 1.45rem;
        line-height: 1.3;
        margin: 4px 0 0;
      }
      .close {
        border: 0;
        background: #eff2f7;
        border-radius: 50%;
        width: 39px;
        height: 39px;
        cursor: pointer;
        font-size: 1.25rem;
      }
      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 22px;
      }
      .detail {
        background: #f5f7fb;
        border-radius: 12px;
        padding: 12px 14px;
      }
      .detail.full {
        grid-column: 1/-1;
      }
      .detail small {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        margin-bottom: 5px;
      }
      .detail strong {
        font-size: 0.94rem;
        line-height: 1.4;
      }
      .note {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.55;
      }
      @media (max-width: 800px) {
        .app {
          padding: 10px 10px 18px;
        }
        .top {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .term {
          display: none;
        }
        .quick-info {
          width: 100%;
          justify-content: space-between;
          gap: 10px;
        }
        .controls {
          align-items: flex-start;
          flex-direction: column;
        }
        .legend {
          width: 100%;
        }
        .hint {
          white-space: normal;
        }
        .scroll {
          height: calc(100vh - 190px);
          min-height: 520px;
        }
        .schedule {
          grid-template-columns: 75px repeat(7, 165px);
        }
        .corner {
          width: 75px;
        }
        .day-head {
          padding: 12px 10px;
        }
        .class-card {
          padding: 8px;
        }
      }
      @media (max-width: 500px) {
        .top h1 {
          font-size: 1.65rem;
        }
        .next-inline strong {
          max-width: 180px;
        }
        .next-time {
          display: none;
        }
        .meta {
          display: none;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .detail.full {
          grid-column: auto;
        }
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <div class="eyebrow">MMU · B.C.S (Hons)</div>
          <h1>我的课程时间表</h1>
          <p>Trimester Oct/Nov 2026 · 点击课程查看详情</p>
        </div>
        <div class="quick-info">
          <div class="next-inline">
            <small>下一堂课</small><strong id="nextName">—</strong> <span></span
            ><span class="next-time" id="nextTime">—</span>
          </div>
          <div class="meta">10 堂 · 20 小时</div>
          <div class="term">
            <small>学期日期</small><strong>9 Nov 2026 — 14 Feb 2027</strong>
          </div>
        </div>
      </header>
      <div class="controls">
        <div class="legend" id="legend"></div>
        <div class="hint">横向滑动可查看整周 · 课程时间为马来西亚时间</div>
      </div>
      <section class="schedule-wrap" aria-label="每周课程时间表">
        <div class="scroll" id="scroll">
          <div class="schedule" id="schedule"></div>
        </div>
      </section>
    </main>
    <dialog id="detailDialog">
      <div class="modal">
        <div class="modal-top">
          <div>
            <div class="modal-code" id="modalCode"></div>
            <h2 id="modalTitle"></h2>
          </div>
          <button class="close" id="closeDialog" aria-label="关闭">×</button>
        </div>
        <div class="details">
          <div class="detail">
            <small>上课时间</small><strong id="modalTime"></strong>
          </div>
          <div class="detail">
            <small>类型</small><strong id="modalKind"></strong>
          </div>
          <div class="detail">
            <small>Class section</small><strong id="modalSection"></strong>
          </div>
          <div class="detail full">
            <small>教室</small><strong id="modalRoom"></strong>
          </div>
          <div class="detail full">
            <small>上课日期</small><strong id="modalDates"></strong>
          </div>
          <div class="detail">
            <small>学分</small><strong id="modalUnits"></strong>
          </div>
          <div class="detail">
            <small>Class number</small><strong id="modalClass"></strong>
          </div>
        </div>
        <p class="note">
          日期与教室来自你提供的课程系统截图；如校方临时调整，请以 eBwise
          最新通知为准。
        </p>
      </div>
    </dialog>
    <script>
      const DAYS = [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday",
        ],
        DATES = [
          "Nov 23",
          "Nov 24",
          "Nov 25",
          "Nov 26",
          "Nov 27",
          "Nov 28",
          "Nov 29",
        ];
      const courses = {
        CS6214: {
          fullCode: "C CS6214",
          name: "Cybersecurity Fundamentals",
          units: "4.00",
        },
        CS6224: {
          fullCode: "C CS6224",
          name: "Network Security",
          units: "4.00",
        },
        CS6314: {
          fullCode: "C CS6314",
          name: "Cryptography & Data Security",
          units: "4.00",
        },
        MA6134: {
          fullCode: "C MA6134",
          name: "Computational Methods",
          units: "4.00",
        },
        PU3192: {
          fullCode: "LM PU3192",
          name: "Falsafah dan Isu Semasa",
          units: "2.00",
        },
        SW6112: {
          fullCode: "LS SW6112",
          name: "Sustainable Society",
          units: "2.00",
        },
      };
      const classes = [
        {
          course: "PU3192",
          day: 0,
          start: "08:00",
          end: "10:00",
          kind: "Lecture",
          section: "FC1L",
          room: "CQCR2004-FCI Classroom",
          classNo: "2961",
          dates: "9 Nov 2026 — 8 Feb 2027",
        },
        {
          course: "MA6134",
          day: 0,
          start: "10:00",
          end: "12:00",
          kind: "Tutorial",
          section: "TT1L",
          room: "CQAR3002-FCI Computing Lab",
          classNo: "4177",
          dates: "9 Nov 2026 — 13 Feb 2027",
        },
        {
          course: "CS6214",
          day: 0,
          start: "12:00",
          end: "14:00",
          kind: "Lecture",
          section: "TC1L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3703",
          dates: "9 Nov 2026 — 8 Feb 2027",
        },
        {
          course: "CS6224",
          day: 1,
          start: "12:00",
          end: "14:00",
          kind: "Tutorial",
          section: "TT1L",
          room: "CQAR3002-FCI Computing Lab",
          classNo: "4287",
          dates: "9 Nov 2026 — 13 Feb 2027",
        },
        {
          course: "CS6224",
          day: 1,
          start: "14:00",
          end: "16:00",
          kind: "Lecture",
          section: "TC1L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3704",
          dates: "10 Nov 2026 — 9 Feb 2027",
        },
        {
          course: "CS6314",
          day: 2,
          start: "08:00",
          end: "10:00",
          kind: "Tutorial",
          section: "TT8L",
          room: "CQAR2007-FCI CISCO IP C.I. C2",
          classNo: "3710",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "MA6134",
          day: 2,
          start: "10:00",
          end: "12:00",
          kind: "Lecture",
          section: "TC1L",
          room: "CQAR1009-FCI Tutorial room",
          classNo: "3774",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "CS6314",
          day: 2,
          start: "12:00",
          end: "14:00",
          kind: "Lecture",
          section: "TC3L",
          room: "CQAR1006-FCI Tutorial ROOM",
          classNo: "3718",
          dates: "11 Nov 2026 — 10 Feb 2027",
        },
        {
          course: "SW6112",
          day: 2,
          start: "14:00",
          end: "16:00",
          kind: "Lecture",
          section: "FC1L",
          room: "To be Announced",
          classNo: "4137",
          dates: "9 Nov 2026 — 14 Feb 2027",
        },
        {
          course: "CS6214",
          day: 2,
          start: "16:00",
          end: "18:00",
          kind: "Tutorial",
          section: "TT1L",
          room: "CQAR3002-FCI Computing Lab",
          classNo: "4283",
          dates: "9 Nov 2026 — 13 Feb 2027",
        },
      ];
      let selected = "ALL";
      const $ = (s) => document.querySelector(s),
        toMin = (t) => {
          const [h, m] = t.split(":").map(Number);
          return h * 60 + m;
        };
      function renderLegend() {
        const keys = ["ALL", ...Object.keys(courses)];
        $("#legend").innerHTML = keys
          .map(
            (k) =>
              `<button class="chip ${selected === k ? "active" : ""}" data-course="${k}">${k === "ALL" ? "全部课程" : courses[k].fullCode}</button>`,
          )
          .join("");
        document.querySelectorAll(".chip").forEach(
          (b) =>
            (b.onclick = () => {
              selected = b.dataset.course;
              renderLegend();
              render();
            }),
        );
      }
      function render() {
        const now = new Date();
        const availableHeight =
          $("#scroll").clientHeight || window.innerHeight - 142;
        const hourHeight =
          window.innerWidth <= 800
            ? 54
            : Math.max(24, Math.min(44, (availableHeight - 56) / 19));
        document.documentElement.style.setProperty("--hour", `${hourHeight}px`);
        document.body.classList.toggle("fit-tight", hourHeight < 30);
        let html =
          '<div class="corner">TIME</div>' +
          DAYS.map(
            (d, i) =>
              `<div class="day-head ${(now.getDay() + 6) % 7 === i ? "today" : ""}"><span>${DATES[i]}</span><strong>${d}</strong></div>`,
          ).join("");
        html +=
          '<div class="time-col" style="height:calc(19 * var(--hour))">' +
          Array.from(
            { length: 20 },
            (_, i) =>
              `<span class="time" style="top:${i * hourHeight}px">${String((i + 5) % 24).padStart(2, "0")}:00</span>`,
          ).join("") +
          "</div>";
        for (let d = 0; d < 7; d++) {
          const list = classes.filter((c) => c.day === d);
          html += `<div class="day-col" style="height:calc(19 * var(--hour))">${list.length ? "" : '<span class="empty">No class</span>'}`;
          for (const c of list) {
            const top = (toMin(c.start) - 300) * (hourHeight / 60),
              height = (toMin(c.end) - toMin(c.start)) * (hourHeight / 60) - 3,
              dim = selected !== "ALL" && selected !== c.course;
            html += `<button class="class-card ${dim ? "dim" : ""}" aria-label="${courses[c.course].name}, ${c.kind}, ${c.start}–${c.end}" data-course="${c.course}" data-index="${classes.indexOf(c)}" style="top:${top}px;height:${height}px"><span class="code">${courses[c.course].name}</span><span class="kind">${c.kind} · ${c.start}–${c.end}</span><span class="room">${c.room}</span></button>`;
          }
          if ((now.getDay() + 6) % 7 === d && now.getHours() >= 5) {
            const top =
              (now.getHours() * 60 + now.getMinutes() - 300) *
              (hourHeight / 60);
            html += `<div class="now" style="top:${top}px"></div>`;
          }
          html += "</div>";
        }
        $("#schedule").innerHTML = html;
        document
          .querySelectorAll(".class-card")
          .forEach(
            (b) => (b.onclick = () => showDetail(classes[+b.dataset.index])),
          );
      }
      function showDetail(c) {
        const info = courses[c.course];
        $("#modalCode").textContent = info.fullCode;
        $("#modalTitle").textContent = info.name;
        $("#modalTime").textContent = `${DAYS[c.day]} · ${c.start}–${c.end}`;
        $("#modalKind").textContent = c.kind;
        $("#modalSection").textContent = c.section;
        $("#modalRoom").textContent = c.room;
        $("#modalDates").textContent = c.dates;
        $("#modalUnits").textContent = info.units;
        $("#modalClass").textContent = c.classNo;
        $("#detailDialog").showModal();
      }
      function nextClass() {
        const now = new Date(),
          d = (now.getDay() + 6) % 7,
          m = now.getHours() * 60 + now.getMinutes();
        const next = classes
          .filter((c) => c.day > d || (c.day === d && toMin(c.start) >= m))
          .sort((a, b) => a.day - b.day || toMin(a.start) - toMin(b.start))[0];
        $("#nextName").textContent = next
          ? `${courses[next.course].name} · ${next.kind}`
          : "本周课程已结束";
        $("#nextTime").textContent = next
          ? `${next.day === d ? "今天" : DAYS[next.day]} ${next.start}`
          : "休息一下";
      }
      $("#closeDialog").onclick = () => $("#detailDialog").close();
      $("#detailDialog").onclick = (e) => {
        if (e.target === $("#detailDialog")) $("#detailDialog").close();
      };
      renderLegend();
      render();
      nextClass();
      let resizeFrame;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(render);
      });
      setInterval(() => {
        render();
        nextClass();
      }, 60000);
    </script>
  </body>
</html>
